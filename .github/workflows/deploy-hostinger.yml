name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    name: Sync via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize FTP inputs
        id: ftp
        run: |
          host="${{ secrets.FTP_HOST }}"
          host="${host#ftp://}"
          host="${host#ftps://}"
          host="${host#sftp://}"
          host="${host%/}"
          echo "host=$host" >> "$GITHUB_OUTPUT"

          dir="${{ secrets.FTP_REMOTE_ROOT }}"
          [[ "$dir" != */ ]] && dir="$dir/"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.dir }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/scripts/**
            **/.env*
            **/package.json
            **/package-lock.json
            **/README.md
