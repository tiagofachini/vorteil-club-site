name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    name: Sync via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize FTP inputs
        id: ftp
        run: |
          host="${{ secrets.FTP_HOST }}"
          host="${host#ftp://}"
          host="${host#ftps://}"
          host="${host#sftp://}"
          host="${host%/}"
          # O repositório é público e os logs do Actions também: não expor o endereço do FTP.
          echo "::add-mask::$host"
          echo "host=$host" >> "$GITHUB_OUTPUT"

          dir="${{ secrets.FTP_REMOTE_ROOT }}"
          [[ "$dir" != */ ]] && dir="$dir/"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.dir }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/scripts/**
            **/.env*
            **/package.json
            **/package-lock.json
            **/README.md

      # Arquivos de projeto não podem ficar na raiz publicada: ficam acessíveis pela
      # internet e o scanner de vulnerabilidades da Hostinger lê os manifestos de
      # dependências que estiverem lá. O prefixo "-" no comando faz o curl ignorar o
      # erro quando o arquivo não existe, então este passo é idempotente.
      - name: Remove project files from the web root
        env:
          FTP_HOST: ${{ steps.ftp.outputs.host }}
          FTP_DIR: ${{ steps.ftp.outputs.dir }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          quote=()
          for f in package.json package-lock.json README.md .gitignore .env .env.example \
                   scripts/deploy.js scripts/dev-server.js .github/workflows/deploy-hostinger.yml; do
            quote+=(-Q "-DELE ${FTP_DIR}${f}")
          done
          for d in .github/workflows .github scripts; do
            quote+=(-Q "-RMD ${FTP_DIR}${d}")
          done

          if ! listing=$(curl --silent --ssl-reqd --insecure --connect-timeout 30 \
                 --user "${FTP_USER}:${FTP_PASSWORD}" "${quote[@]}" --list-only \
                 "ftp://${FTP_HOST}${FTP_DIR}" 2>&1); then
            echo "::warning::Não foi possível acessar o servidor para remover arquivos de projeto."
            exit 0
          fi

          left=$(printf '%s\n' "$listing" | grep -xE 'package(-lock)?\.json|README\.md|\.gitignore|\.env.*|scripts|\.github|node_modules' || true)
          if [ -n "$left" ]; then
            echo "::warning::Ainda há arquivos de projeto no servidor: $(echo $left)"
          else
            echo "Raiz publicada limpa: nenhum arquivo de projeto encontrado."
          fi
