name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    name: Sync via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize remote dir
        id: remote-dir
        run: |
          dir="${{ secrets.FTP_REMOTE_ROOT }}"
          [[ "$dir" != */ ]] && dir="$dir/"
          echo "value=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.remote-dir.outputs.value }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/scripts/**
            **/.env*
            **/package.json
            **/package-lock.json
            **/README.md
