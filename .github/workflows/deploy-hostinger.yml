name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    name: Sync via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize FTP inputs
        id: ftp
        run: |
          host="${{ secrets.FTP_HOST }}"
          host="${host#ftp://}"
          host="${host#ftps://}"
          host="${host#sftp://}"
          host="${host%/}"
          # O repositório é público e os logs do Actions também: não expor o endereço do FTP.
          echo "::add-mask::$host"
          echo "host=$host" >> "$GITHUB_OUTPUT"

          dir="${{ secrets.FTP_REMOTE_ROOT }}"
          [[ "$dir" != */ ]] && dir="$dir/"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.dir }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/scripts/**
            **/.env*
            **/package.json
            **/package-lock.json
            **/README.md


      # Arquivos de projeto não podem ficar na raiz publicada: ficam acessíveis pela
      # internet e o scanner de vulnerabilidades da Hostinger lê os manifestos de
      # dependências que estiverem lá. O prefixo "*" no comando do curl faz ele seguir
      # em frente quando o arquivo não existe, então este passo é idempotente.
      - name: Remove project files from the web root
        env:
          FTP_HOST: ${{ steps.ftp.outputs.host }}
          FTP_DIR: ${{ steps.ftp.outputs.dir }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          files="package.json package-lock.json README.md .gitignore .env .env.example scripts/deploy.js scripts/dev-server.js .github/workflows/deploy-hostinger.yml"

          quote=()
          for f in $files; do quote+=(-Q "*DELE ${FTP_DIR}${f}"); done
          for d in .github/workflows .github scripts; do quote+=(-Q "*RMD ${FTP_DIR}${d}"); done

          if ! curl --silent --ssl-reqd --insecure --connect-timeout 30 \
                 --user "${FTP_USER}:${FTP_PASSWORD}" "${quote[@]}" --list-only \
                 "ftp://${FTP_HOST}${FTP_DIR}" > /dev/null 2>&1; then
            echo "::warning::Não foi possível acessar o servidor para remover arquivos de projeto."
          fi

          # Confere pelo lado de fora, como qualquer visitante ou scanner veria
          # (o parâmetro único evita responder pelo cache do CDN).
          exposed=""
          for f in $files; do
            case "$f" in .env*) continue ;; esac
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 15 \
                     "https://vorteilclub.com.br/${f}?cb=${GITHUB_RUN_ID}" || true)
            if [ "$code" = "200" ]; then exposed="$exposed $f"; fi
          done

          if [ -n "$exposed" ]; then
            echo "::warning::Ainda acessíveis em vorteilclub.com.br:$exposed"
          else
            echo "Verificado: nenhum arquivo de projeto está acessível em vorteilclub.com.br."
          fi
